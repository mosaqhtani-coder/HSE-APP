<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة ملاحظات السلامة</title>
<meta name="theme-color" content="#1F4E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSE ملاحظات">
<style>
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;background:#1F4E78;color:#fff;font-family:system-ui,Tahoma,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
img{width:96px;height:96px;border-radius:22px}
h1{font-size:20px;margin:16px 0 6px}
p{opacity:.85;margin:0 0 18px;font-size:14px}
a.btn,button{display:inline-block;padding:12px 26px;border:0;border-radius:10px;font-size:16px;background:#fff;color:#1F4E78;text-decoration:none;cursor:pointer}
.sp{width:28px;height:28px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div>
  <img src="icons/icon-192.png" alt="">
  <h1>لوحة ملاحظات السلامة</h1>
  <p id="msg">جاري فتح اللوحة…</p>
  <div class="sp" id="sp"></div>
  <a class="btn" id="open" href="#">فتح اللوحة</a>
</div>
<script>
// رابط لوحة Apps Script (نشر الويب). غيّره هنا فقط عند تغيير النشر.
var APP_URL = 'https://script.google.com/macros/s/AKfycbxuEEbPMyZJtqC-nVFii44_RjQb3OUck_zCAG9IgqjtGn1PvkNausc4YPSCyT0kQp0_bg/exec';
document.getElementById('open').href = APP_URL;
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
var manual = /[?&]manual=1/.test(location.search);
if (!navigator.onLine) { location.replace('offline.html'); }
else if (!manual) { setTimeout(function () { location.replace(APP_URL); }, 600); }
else { document.getElementById('sp').style.display = 'none'; document.getElementById('msg').textContent = 'اضغط لفتح اللوحة'; }
</script>
</body>
</html>
